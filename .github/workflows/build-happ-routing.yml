name: Verify release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shadowrocket*.conf"
      - "modules/**"
      - "rules/*.list"
      - "distillate/**"
      - "Amnezia/**"
      - "scripts/**"
      - "tests/**"
      - "HAPP/**"
      - "INCY/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Rebuild cached artifacts
        run: |
          python3 scripts/build_distillate.py --skip-compiled
          python3 scripts/build_amnezia_routing.py
          python3 scripts/build_clash_config.py --conf shadowrocket.conf
          python3 scripts/build_happ_routing.py
          python3 scripts/build_incy_routing.py
          python3 scripts/build_potato_link_worker.py

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests

      - name: Verify generated files are current
        run: git diff --exit-code
