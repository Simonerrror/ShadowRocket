name: Deploy potato box

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/potato-box/**"
      - ".github/workflows/deploy-potato-box.yml"
      - "tests/test_workflows.py"
  pull_request:
    paths:
      - "cloudflare/potato-box/**"
      - ".github/workflows/deploy-potato-box.yml"
      - "tests/test_workflows.py"

permissions:
  contents: read

concurrency:
  group: potato-box-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: cloudflare/potato-box/package-lock.json

      - name: Install exact Worker dependencies
        run: npm ci --ignore-scripts --prefix cloudflare/potato-box

      - name: Audit production dependencies
        run: npm audit --omit=dev --prefix cloudflare/potato-box

      - name: Run Worker tests
        run: npm test --prefix cloudflare/potato-box

      - name: Validate Worker bundle
        run: npm run deploy:dry --prefix cloudflare/potato-box

  deploy:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: cloudflare/potato-box/package-lock.json

      - name: Install exact Worker dependencies
        run: npm ci --ignore-scripts --prefix cloudflare/potato-box

      - name: Deploy Worker code while preserving runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --prefix cloudflare/potato-box
