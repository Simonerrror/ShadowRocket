name: Verify release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shadowrocket*.conf"
      - "modules/**"
      - "rules/*.list"
      - "distillate/**"
      - "scripts/**"
      - "tests/**"
      - "INCY/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: site/clash/package-lock.json

      - name: Install exact generator build dependencies
        run: npm ci --ignore-scripts --prefix site/clash

      - name: Audit generator build dependencies
        run: npm audit --include=dev --audit-level=high --prefix site/clash

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Rebuild cached artifacts
        run: |
          python3 scripts/build_distillate.py --skip-compiled
          python3 scripts/build_clash_config.py --conf shadowrocket.conf
          python3 scripts/build_incy_routing.py
          python3 scripts/build_site.py
          python3 scripts/build_clash_page.py

      - name: Run tests
        run: |
          npm test --prefix site/clash
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests

      - name: Verify generated files are current
        run: git diff --exit-code
