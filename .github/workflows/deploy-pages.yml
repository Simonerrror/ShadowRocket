name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "modules/**"
      - "INCY/DEFAULT.DEEPLINK"
      - "INCY/RU-VPN.DEEPLINK"
      - "scripts/build_site.py"
      - "tests/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "modules/**"
      - "INCY/DEFAULT.DEEPLINK"
      - "INCY/RU-VPN.DEEPLINK"
      - "scripts/build_site.py"
      - "tests/**"
      - ".github/workflows/*.yml"
  workflow_run:
    workflows: ["Sync rule lists"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      verified_sha: ${{ steps.capture_verified_sha.outputs.verified_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Capture verified revision
        id: capture_verified_sha
        run: echo "verified_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Verify generated page is current
        run: git diff --exit-code

      - name: Run public tests
        run: |
          python3 -m unittest discover -s tests
          python3 -m compileall -q scripts tests

  deploy:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Request native Pages build for verified main
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$latest_sha" = "$VERIFIED_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
