# CLASH VERGE REV (MIHOMO) CONFIG
# AUTO-GENERATED FROM shadowrocket.conf
# Shared routing rules; one automatic Mihomo pool

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false
geoip-code: RU

# 1. TUN MODE
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

# 2. DNS (Fake-IP)
dns:
  enable: true
  listen: 127.0.0.1:1053
  use-hosts: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "*.localdomain"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu"
    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "*.ntp.org"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - 9.9.9.9
    - 149.112.112.112
    - 77.88.8.8

# 3. PROVIDERS
proxy-providers:
  Main-Sub:
    type: http
    url: "<INSERT_SUBSCRIPTION_URL_HERE>"
    interval: 3600
    path: ./proxies/main.yaml
    health-check:
      enable: true
      interval: 780
      url: "https://www.youtube.com/favicon.ico"

# 4. RULE PROVIDERS
rule-providers:
  torrent_block:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/Simonerrror/ShadowRocket/main/rules/torrent_block.list"
    path: ./rules/torrent_block.yaml
    interval: 86400

  whitelist_direct:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/Simonerrror/ShadowRocket/main/rules/whitelist_direct.list"
    path: ./rules/whitelist_direct.yaml
    interval: 86400

  greylist_proxy:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/Simonerrror/ShadowRocket/main/rules/greylist_proxy.list"
    path: ./rules/greylist_proxy.yaml
    interval: 86400

  microsoft:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/Simonerrror/ShadowRocket/main/rules/microsoft.list"
    path: ./rules/microsoft.yaml
    interval: 86400

  domains_community:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/Simonerrror/ShadowRocket/main/rules/domains_community.list"
    path: ./rules/domains_community.yaml
    interval: 86400

# 5. PROXY GROUPS
proxy-groups:
  - name: Режим
    type: url-test
    use:
      - Main-Sub
    exclude-filter: "(?i)Russia|Belarus|Ukraine|\\b(?:WL|SS)\\b"
    url: "https://www.youtube.com/favicon.ico"
    interval: 180
    tolerance: 100

# 6. RULES
rules:
  - RULE-SET,torrent_block,REJECT
  - RULE-SET,whitelist_direct,DIRECT
  - RULE-SET,greylist_proxy,Режим
  - RULE-SET,microsoft,Режим
  - RULE-SET,domains_community,Режим
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - GEOIP,RU,DIRECT
  - GEOIP,private,DIRECT
  - MATCH,Режим
